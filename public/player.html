<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foltynsrc — player</title>
<style>
    :root { --bg: #000; --text: #fff; --muted: #ddd; --bad: #ffd8d8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
    body { display: grid; place-items: center; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .player { position: relative; width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; display: block; background: #000; outline: none; object-fit: contain; }
    #status { position: absolute; inset: 50% 16px auto; z-index: 1; transform: translateY(-50%); display: none; max-width: 720px; margin: 0 auto; padding: 12px 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: var(--muted); background: rgba(0,0,0,.82); text-align: center; overflow-wrap: anywhere; }
    #status.visible { display: block; }
    #status.err { color: var(--bad); border-color: rgba(255,216,216,.45); }
</style>
</head>
<body>
<div class="player">
    <video id="video" controls playsinline></video>
    <div id="status" role="status" aria-live="polite">Starting…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
    var qs = new URLSearchParams(location.search);
    var target = qs.get('url');
    var video = document.getElementById('video');
    var statusEl = document.getElementById('status');

    function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.className = 'visible ' + (tone || '');
    }

    function clearStatus() {
        statusEl.className = '';
        statusEl.textContent = '';
    }

    if (!target) { setStatus('Missing ?url=<master.m3u8>', 'err'); return; }

    var targetUrl;
    try {
        targetUrl = new URL(target);
        if (targetUrl.protocol !== 'http:' && targetUrl.protocol !== 'https:') throw new Error('bad protocol');
    } catch (e) { setStatus('Invalid ?url= — must be an absolute HTTP(S) URL', 'err'); return; }

    function startPlayback(playUrl) {
        setStatus('Loading stream…');

        if (window.Hls && Hls.isSupported()) {
            var hls = new Hls({ maxBufferLength: 30 });
            hls.on(Hls.Events.ERROR, function (_event, data) {
                if (data.fatal) {
                    setStatus('Playback error: ' + data.details + (data.response && data.response.code ? ' (HTTP ' + data.response.code + ')' : ''), 'err');
                    try { hls.destroy(); } catch (e) {}
                }
            });
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                clearStatus();
                video.play().catch(function () {});
            });
            hls.loadSource(playUrl);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = playUrl;
            video.play().catch(function () {});
            clearStatus();
        } else {
            setStatus('This browser cannot play HLS streams. Use a modern browser.', 'err');
        }
    }

    // Combined relay URLs (/proxy?url=…) come from our own origin and already
    // carry the client-minted token, so skip minting here: the relay stamps its
    // own server token and rewrites the playlist for playback.
    if (targetUrl.origin === window.location.origin && targetUrl.pathname === '/proxy') {
        startPlayback(targetUrl.toString());
        return;
    }

    // Mint the token FROM THE VIEWER so its ip_cidr matches the browser that plays.
    setStatus('Minting access token from ' + targetUrl.origin + ' …');
    fetch(targetUrl.origin + '/generate.php', { credentials: 'omit' })
        .then(function (res) {
            if (!res.ok) throw new Error('generate.php returned HTTP ' + res.status);
            return res.text();
        })
        .then(function (text) {
            var token = text.trim();
            try {
                var j = JSON.parse(token);
                if (typeof j === 'string') token = j;
                else if (j && typeof j === 'object') token = j.token || j.data || j.string || j.result || token;
            } catch (e) { /* plain-text token */ }
            if (!token) throw new Error('generate.php returned an empty token');
            return token;
        })
        .then(function (token) {
            var playUrl = new URL(target);
            playUrl.searchParams.set('token', token);
            startPlayback(playUrl.toString());
        })
        .catch(function (error) {
            var msg = error && error.message ? error.message : String(error);
            setStatus('Could not start direct playback: ' + msg +
                ' — if this is a network/CORS failure, the upstream host refused a cross-origin browser request; use the server proxy instead.', 'err');
        });
})();
</script>
</body>
</html>
