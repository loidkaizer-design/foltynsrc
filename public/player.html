*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#333;font-family:Helvetica,Arial,sans-serif}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.player{position:relative;width:min(960px,100%);max-height:calc(100vh - 70px);aspect-ratio:16/9;background:#000;box-shadow:0 1px 3px rgba(0,0,0,.5);overflow:hidden;outline:none;user-select:none;-webkit-user-select:none;opacity:0;transform:scale(.88);transition:opacity .25s linear,transform .25s ease-out}
.player.ready{opacity:1;transform:none}
.player:fullscreen{max-height:none;width:100%;height:100%;aspect-ratio:auto}
.player::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);pointer-events:none}
video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.surface{position:absolute;inset:0;touch-action:manipulation}
.player.hide{cursor:none}
/* icons: every glyph comes from the Foltyn+ sprite / PiP / Cast SVGs */
.ic{--k:1;--x:0;--y:0;--w:30;--h:30;display:block;width:calc(var(--w)*var(--k)*1px);height:calc(var(--h)*var(--k)*1px);background:var(--sprite) no-repeat;background-size:calc(120px*var(--k)) calc(420px*var(--k));background-position:calc(var(--x)*var(--k)*-1px) calc(var(--y)*var(--k)*-1px);pointer-events:none}
.i-bigplay{--w:120;--h:120}.i-bigreplay{--y:300;--w:120;--h:120}
.i-replay{--x:10;--y:120}.i-play{--x:10;--y:150}.i-pause{--x:10;--y:180}
.i-v0{--x:40;--y:120}.i-v1{--x:40;--y:150}.i-v2{--x:40;--y:180}.i-v3{--x:40;--y:210}
.i-fs{--x:70;--y:150}.i-fsx{--x:70;--y:180}
.i-pip{background:var(--pip) center/20px 20px no-repeat}.i-cast{background:var(--cast) center/20px 20px no-repeat}
.stack{position:relative;display:block;width:30px;height:30px}
.stack .ic{position:absolute;left:0;top:0;opacity:0;transform:scale(.55);transition:opacity .18s linear,transform .24s cubic-bezier(.2,.9,.3,1.2)}
.stack .ic.on{opacity:1;transform:none}
/* controls */
.controls{position:absolute;left:0;right:0;bottom:0;padding:0 8px 4px;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.45) 50%,transparent);transition:opacity .25s linear,transform .25s ease-out}
.player.hide .controls{opacity:0;transform:translateY(8px);pointer-events:none}
.prog{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;width:100%;height:4px;background:rgba(255,255,255,.25);border-radius:2px;transition:height .1s}
.prog:hover .track,.prog.drag .track{height:6px}
.buf,.played{position:absolute;left:0;top:0;bottom:0;border-radius:2px;width:0}
.buf{background:rgba(255,255,255,.3)}.played{background:#fff}
.thumb{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .12s}
.prog:hover .thumb,.prog.drag .thumb{transform:scale(1)}
.row{display:flex;align-items:center;height:40px}
.cb{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:40px;height:40px;cursor:pointer;opacity:.75;transition:opacity .1s linear,transform .1s ease-out}
.cb:hover,.cb.active{opacity:1}.cb:active{transform:scale(.9)}.cb:focus-visible{outline:2px solid #fff;outline-offset:-4px;border-radius:6px}
.cb[hidden]{display:none}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;margin:0;accent-color:#fff;transition:width .2s,opacity .2s}
.vol:hover input,.vol:focus-within input{width:72px;opacity:1;margin:0 8px 0 2px}
@media(hover:none){.vol input{display:none}}
.time{color:#fff;opacity:.85;font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp{flex:1}
/* big button + center flash */
.big{all:unset;position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s linear,transform .1s}
.big .stack{width:132px;height:132px}.big .ic{--k:1.1}
.player.idle .big{opacity:.75;pointer-events:auto}.player.idle .big:hover{opacity:1}.big:active{transform:scale(.95)}
.flash{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.flash .ic{--k:2.2;position:absolute;left:0;top:0;opacity:0;transform:translate(-50%,-50%) scale(.5);filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
/* double-tap seek */
.seek{position:absolute;top:0;bottom:0;width:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;pointer-events:none;opacity:0;background:rgba(255,255,255,.14);transition:opacity .2s}
.seek.show{opacity:1}
.seek-L{left:0;border-radius:0 50% 50% 0/0 100% 100% 0}.seek-R{right:0;border-radius:50% 0 0 50%/100% 0 0 100%}
.arrows{display:flex}.arrows .ic{--k:.8;opacity:0}
.seek-L .arrows{transform:scaleX(-1)}
.lbl{color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ripple{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.18) 60%,transparent 70%);pointer-events:none}
.credit{margin:0;color:#aaa;font-size:12px}.credit a{color:#dedede}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
.notice{position:absolute;z-index:9;left:50%;top:50%;max-width:calc(100% - 36px);padding:12px 16px;transform:translate(-50%,-50%);border-radius:4px;background:rgba(0,0,0,.72);color:#fff;text-align:center;line-height:1.45;font-size:14px;pointer-events:none;display:none}.notice.show{display:block}.notice.error{background:rgba(80,0,0,.84)}
</style>
<script>window.__onGCastApiAvailable=function(ok){if(ok&&window.FoltynCast)window.FoltynCast()}</script>
<script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
<main class="stage">
<div class="player" id="p" tabindex="0" aria-label="Foltyn+ video player">
  <video id="v" playsinline preload="metadata" aria-label="Foltyn+ video player"></video>
  <div class="notice show" id="notice" role="status" aria-live="polite">Loading HLS playlist…</div>
  <div class="surface" id="sf"></div>
  <div class="seek seek-L" id="sL"><div class="arrows"><i class="ic i-play"></i><i class="ic i-play"></i><i class="ic i-play"></i></div><span class="lbl"></span></div>
  <div class="seek seek-R" id="sR"><div class="arrows"><i class="ic i-play"></i><i class="ic i-play"></i><i class="ic i-play"></i></div><span class="lbl"></span></div>
  <div class="flash" id="fl"><i class="ic i-play" data-f="play"></i><i class="ic i-pause" data-f="pause"></i></div>
  <button class="big" id="big" aria-label="Play"><span class="stack"><i class="ic i-bigplay on"></i><i class="ic i-bigreplay"></i></span></button>
  <div class="controls" id="ctl">
    <div class="prog" id="prog" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuenow="0"><div class="track"><div class="buf" id="buf"></div><div class="played" id="pl"></div><div class="thumb" id="th"></div></div></div>
    <div class="row">
      <button class="cb" id="pp" aria-label="Play"><span class="stack"><i class="ic i-play on"></i><i class="ic i-pause"></i><i class="ic i-replay"></i></span></button>
      <div class="vol"><button class="cb" id="mute" aria-label="Mute"><span class="stack"><i class="ic i-v0"></i><i class="ic i-v1"></i><i class="ic i-v2"></i><i class="ic i-v3 on"></i></span></button><input id="vr" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
      <span class="time" id="tm">0:00 / 0:00</span><span class="sp"></span>
      <button class="cb" id="pip" aria-label="Picture in Picture" hidden><i class="ic i-pip" style="width:30px;height:30px"></i></button>
      <button class="cb" id="cast" aria-label="Cast to device" hidden><i class="ic i-cast" style="width:30px;height:30px"></i></button>
      <button class="cb" id="fs" aria-label="Fullscreen"><span class="stack"><i class="ic i-fs on"></i><i class="ic i-fsx"></i></span></button>
    </div>
  </div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),P=$('p'),v=$('v'),sf=$('sf'),notice=$('notice');
let activeSourceUrl='',hls=null;
const showMessage=(text,error=false)=>{notice.textContent=text;notice.classList.toggle('show',!!text);notice.classList.toggle('error',error)};
const playbackError=message=>{console.error('[Foltyn+] Player error:',message);P.classList.add('error');showMessage(message,true)};
function loadHlsSource(url){
 const source=String(url||'').trim();if(!source)throw new Error('No HLS playlist URL was provided');
 activeSourceUrl=source;P.classList.remove('error');showMessage('Loading HLS playlist…');
 if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=source;v.load();v.play().catch(()=>{});return}
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls({enableWorker:true});
  hls.on(Hls.Events.ERROR,(_event,data)=>{if(data.fatal)playbackError('HLS playback failed'+(data.details?': '+data.details:''))});
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{showMessage('');v.play().catch(()=>{})});
  hls.attachMedia(v);hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(source));return
 }
 v.src=source;v.load();v.play().catch(()=>{});
}
v.addEventListener('playing',()=>showMessage(''));
v.addEventListener('loadedmetadata',()=>showMessage(''));
v.addEventListener('error',()=>{if(v.error)playbackError('The HLS stream could not be played (media error '+v.error.code+').')});
const SKIP=10,fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const pick=(el,i)=>[...el.querySelectorAll('.ic')].forEach((n,k)=>n.classList.toggle('on',k===i));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
requestAnimationFrame(()=>P.classList.add('ready'));
let started=false,hideT,raf;
/* ---- controls visibility ---- */
function poke(){P.classList.remove('hide');clearTimeout(hideT);if(!v.paused&&!scrub)hideT=setTimeout(()=>P.classList.add('hide'),2800)}
['pointermove','pointerdown','keydown','focusin'].forEach(e=>P.addEventListener(e,poke));
/* ---- play state ---- */
function sync(){const idle=!started||v.ended;P.classList.toggle('idle',idle);
 pick($('pp'),v.ended?2:v.paused?0:1);pick($('big').firstElementChild,v.ended?1:0);
 $('pp').ariaLabel=$('big').ariaLabel=v.paused?'Play':'Pause';poke()}
function toggle(){const play=v.paused||v.ended;if(v.ended)v.currentTime=0;play?v.play():v.pause();flashIcon(play?'play':'pause')}
function flashIcon(n){const el=$('fl').querySelector(`[data-f=${n}]`);el.getAnimations().forEach(a=>a.cancel());
 el.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.55)'},{opacity:1,offset:.3,transform:'translate(-50%,-50%) scale(1)'},{opacity:0,transform:'translate(-50%,-50%) scale(1.35)'}],{duration:620,easing:'cubic-bezier(.2,.8,.3,1)'})}
v.addEventListener('play',()=>{started=true;sync();cancelAnimationFrame(raf);loop()});
['pause','ended','loadedmetadata','emptied'].forEach(e=>v.addEventListener(e,()=>{sync();ui()}));
$('pp').onclick=()=>toggle();
$('big').onclick=()=>{if(v.ended)v.currentTime=0;v.play()};
/* ---- progress ---- */
let scrub=false;
function ui(){const d=v.duration||0,t=v.currentTime,pct=d?t/d*100:0;$('pl').style.width=pct+'%';$('th').style.left=pct+'%';
 $('tm').textContent=fmt(t)+' / '+fmt(d);$('prog').setAttribute('aria-valuenow',t|0);$('prog').setAttribute('aria-valuemax',d|0)}
function loop(){ui();if(!v.paused&&!v.ended)raf=requestAnimationFrame(loop)}
v.addEventListener('timeupdate',ui);v.addEventListener('seeked',ui);
v.addEventListener('progress',()=>{const b=v.buffered,t=v.currentTime;let e=0;for(let i=0;i<b.length;i++)if(b.start(i)<=t+.5)e=b.end(i);$('buf').style.width=(v.duration?e/v.duration*100:0)+'%'});
const pr=$('prog');
const at=e=>{const r=pr.getBoundingClientRect();if(v.duration)v.currentTime=clamp((e.clientX-r.left)/r.width,0,1)*v.duration;ui()};
pr.addEventListener('pointerdown',e=>{scrub=true;pr.classList.add('drag');pr.setPointerCapture(e.pointerId);at(e)});
pr.addEventListener('pointermove',e=>{if(scrub)at(e)});
const endScrub=()=>{scrub=false;pr.classList.remove('drag');poke()};
pr.addEventListener('pointerup',endScrub);pr.addEventListener('pointercancel',endScrub);
/* ---- volume ---- */
function vol(){const l=v.muted||v.volume===0?0:v.volume<.34?1:v.volume<.67?2:3;pick($('mute'),l);$('vr').value=v.muted?0:v.volume;$('mute').ariaLabel=l?'Mute':'Unmute'}
v.addEventListener('volumechange',vol);
$('mute').onclick=()=>{if(v.muted||v.volume===0){v.muted=false;if(v.volume===0)v.volume=.5}else v.muted=true};
$('vr').oninput=e=>{v.muted=false;v.volume=+e.target.value};
/* ---- PiP / fullscreen / cast ---- */
if(document.pictureInPictureEnabled&&v.requestPictureInPicture){const b=$('pip');b.hidden=false;
 b.onclick=async()=>{try{document.pictureInPictureElement===v?await document.exitPictureInPicture():await v.requestPictureInPicture()}catch(e){console.warn(e)}};
 v.addEventListener('enterpictureinpicture',()=>b.classList.add('active'));v.addEventListener('leavepictureinpicture',()=>b.classList.remove('active'))}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fs(){if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(P.requestFullscreen)P.requestFullscreen();else if(P.webkitRequestFullscreen)P.webkitRequestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
$('fs').onclick=fs;['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>pick($('fs'),fsEl()?1:0)));
window.FoltynCast=()=>{const ctx=cast.framework.CastContext.getInstance();
 ctx.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
 const b=$('cast');b.hidden=false;
 b.onclick=async()=>{try{await ctx.requestSession();const s=ctx.getCurrentSession(),mi=new chrome.cast.media.MediaInfo(activeSourceUrl||v.currentSrc,'application/x-mpegURL'),rq=new chrome.cast.media.LoadRequest(mi);rq.currentTime=v.currentTime;rq.autoplay=!v.paused;await s.loadMedia(rq);v.pause()}catch(e){console.warn('Cast:',e)}};
 ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,e=>b.classList.toggle('active',/STARTED|RESUMED/.test(e.sessionState)))};
if(window.cast&&cast.framework)window.FoltynCast();
/* ---- gestures ---- */
const seekEl={L:$('sL'),R:$('sR')};
let tap={z:null,t:0,timer:0},sk={z:null,total:0,t:0,hide:{L:0,R:0}};
function seekBy(z,x,y){const now=Date.now(),chain=sk.z===z&&now-sk.t<700;sk.total=chain?sk.total+SKIP:SKIP;sk.z=z;sk.t=now;
 if(v.duration)v.currentTime=clamp(v.currentTime+(z==='R'?SKIP:-SKIP),0,v.duration);ui();
 const el=seekEl[z],r=el.getBoundingClientRect();el.classList.add('show');el.querySelector('.lbl').textContent=(z==='R'?'+':'-')+sk.total+'s';
 el.querySelectorAll('.arrows .ic').forEach((a,i)=>{a.getAnimations().forEach(n=>n.cancel());a.animate([{opacity:0},{opacity:1,offset:.45},{opacity:0}],{duration:520,delay:i*110,fill:'backwards'}).onfinish=()=>{}});
 const rp=document.createElement('div');rp.className='ripple';rp.style.left=(x-r.left)+'px';rp.style.top=(y-r.top)+'px';el.appendChild(rp);
 rp.animate([{transform:'scale(.15)',opacity:.9},{transform:'scale(2.6)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>rp.remove();
 clearTimeout(sk.hide[z]);sk.hide[z]=setTimeout(()=>el.classList.remove('show'),750);poke()}
sf.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;
 const r=P.getBoundingClientRect(),x=e.clientX-r.left,z=x<r.width*.33?'L':x>r.width*.67?'R':'C',now=Date.now();
 if(z==='C'){clearTimeout(tap.timer);tap.z=null;toggle();return}
 const chain=sk.z===z&&now-sk.t<700;
 if(chain||(tap.z===z&&now-tap.t<300)){clearTimeout(tap.timer);tap.z=z;tap.t=now;seekBy(z,e.clientX,e.clientY);return}
 tap.z=z;tap.t=now;clearTimeout(tap.timer);
 tap.timer=setTimeout(()=>{tap.z=null;if(e.pointerType==='mouse')toggle();else if(P.classList.contains('hide')||v.paused)poke();else{clearTimeout(hideT);P.classList.add('hide')}},300)});
sf.addEventListener('dblclick',e=>e.preventDefault());
/* ---- keyboard ---- */
P.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),r=P.getBoundingClientRect();let h=true;
 if(k===' '||k==='k')toggle();
 else if(k==='arrowright'||k==='l'){const s=k==='l'?SKIP:5;v.currentTime=clamp(v.currentTime+s,0,v.duration||0);if(k==='l')seekBy('R',r.right-r.width*.15,r.top+r.height/2)}
 else if(k==='arrowleft'||k==='j'){const s=k==='j'?SKIP:5;v.currentTime=clamp(v.currentTime-s,0,v.duration||0);if(k==='j')seekBy('L',r.left+r.width*.15,r.top+r.height/2)}
 else if(k==='arrowup')v.volume=clamp(v.volume+.1,0,1);else if(k==='arrowdown')v.volume=clamp(v.volume-.1,0,1);
 else if(k==='m')$('mute').click();else if(k==='f')fs();else if(k==='p'&&!$('pip').hidden)$('pip').click();else h=false;
 if(h)e.preventDefault()});
async function mintClientToken(origin){
 const response=await fetch(origin+'/generate.php',{credentials:'omit'});
 if(!response.ok)throw new Error('generate.php returned HTTP '+response.status);
 let token=(await response.text()).trim();
 try{const parsed=JSON.parse(token);if(typeof parsed==='string')token=parsed;else if(parsed&&typeof parsed==='object')token=parsed.token||parsed.data||parsed.string||parsed.result||''}catch(_){/* plain-text token */}
 if(!token)throw new Error('generate.php returned an empty token');return token;
}
function relayUrl(url){return location.origin+'/proxy?url='+encodeURIComponent(url)}
async function loadMovieId(id){
 const response=await fetch('/api/movie?id='+encodeURIComponent(id));
 if(!response.ok)throw new Error('Source request failed ('+response.status+')');
 const payload=await response.json();
 const server=(payload.servers||[]).find(item=>item.status==='ready'&&(item.raw||item.url||item.combined_url))||(payload.servers||[]).find(item=>item.raw||item.url||item.combined_url);
 if(!server)throw new Error('No playable HLS source was returned');
 const candidate=server.raw||server.url||server.combined_url;
 if(!candidate)throw new Error('The HLS source URL is empty');
 if(/\/proxy\?url=/i.test(candidate)){loadHlsSource(candidate);return}
 const playlist=new URL(candidate,location.href);
 const origin=server.origin||playlist.origin;
 const token=playlist.searchParams.get('token')||await mintClientToken(origin);
 if(!playlist.searchParams.has('token'))playlist.searchParams.append('token',token);
 loadHlsSource(relayUrl(playlist.href));
}
const params=new URLSearchParams(location.search),directUrl=params.get('url'),tmdbId=params.get('id');
if(directUrl){loadHlsSource(directUrl)}
else if(tmdbId){loadMovieId(tmdbId).catch(error=>playbackError(error.message||'Unable to load this movie'))}
else{playbackError('Missing HLS playlist URL or TMDB ID')}
sync();vol();ui();
})();
</script>
</body>
