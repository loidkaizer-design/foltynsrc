<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Foltyn+ Player</title>
  <link rel="stylesheet" href="https://vjs.zencdn.net/7.0.3/video-js.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #333;
    }
    body {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    .player {
      position: relative; width: min(100vw, 960px);
      height: min(100vh, 540px); aspect-ratio: 16 / 9;
      background: #000; box-shadow: 0 1px 3px rgba(0,0,0,.5);
      line-height: 0; opacity: 0; transform: scale3d(.85,.85,1);
      transition: opacity .25s linear, transform .25s ease-out;
    }
    .player.ready { opacity: 1; transform: scale3d(1,1,1); }
    .player::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05),
                  inset 0 1px 0 rgba(255,255,255,.05);
    }
    .video-js {
      width: 100%; height: 100%; font: 12px Helvetica,Arial,sans-serif;
      text-shadow: none !important; outline: none !important;
      background: #000;
    }
    .video-js .vjs-control-bar { height: 40px; background: transparent; }
    .vjs-control-bar::before {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0;
      height: 120px; pointer-events: none; opacity: .75;
      background: linear-gradient(to top, #000 0%, rgba(0,0,0,.738) 19%,
        rgba(0,0,0,.541) 34%, rgba(0,0,0,.382) 47%,
        rgba(0,0,0,.278) 56.5%, rgba(0,0,0,.194) 65%,
        rgba(0,0,0,.126) 75%, rgba(0,0,0,.063) 88%, transparent);
    }
    .video-js .vjs-play-control, .video-js .vjs-mute-control,
    .video-js .vjs-fullscreen-control,
    .video-js .vjs-progress-control .vjs-progress-holder {
      opacity: .75; transition: transform .1s ease-out, opacity .1s linear;
    }
    .video-js .vjs-play-control, .video-js .vjs-mute-control,
    .video-js .vjs-fullscreen-control {
      width: 30px; height: 30px; margin: 5px; padding: 0 !important;
    }
    .video-js .vjs-control:hover,
    .video-js .vjs-progress-control .vjs-progress-holder:hover { opacity: 1; }
    .video-js .vjs-control:active { transform: scale3d(.95,.95,1); }
    .video-js .vjs-control:focus { outline: none !important; text-shadow: none !important; }
    .video-js .vjs-icon-placeholder::before { content: "" !important; }
    .video-js .vjs-play-control .vjs-icon-placeholder,
    .video-js .vjs-mute-control .vjs-icon-placeholder,
    .video-js .vjs-fullscreen-control .vjs-icon-placeholder {
      display: grid; place-items: center; width: 100%; height: 100%;
    }
    .video-js .vjs-play-control .vjs-icon-placeholder::after {
      content: "▶"; color: #fff; font-size: 17px;
    }
    .video-js .vjs-play-control.vjs-playing .vjs-icon-placeholder::after {
      content: "Ⅱ"; font-size: 18px;
    }
    .video-js .vjs-mute-control .vjs-icon-placeholder::after {
      content: "🔊"; font-size: 15px; filter: grayscale(1);
    }
    .video-js .vjs-mute-control.vjs-vol-0 .vjs-icon-placeholder::after { content: "🔇"; }
    .video-js .vjs-fullscreen-control .vjs-icon-placeholder::after {
      content: "⛶"; color: #fff; font-size: 23px;
    }
    .video-js .vjs-volume-panel { width: 40px !important; height: 40px !important; margin: 0 !important; }
    .video-js .vjs-volume-panel .vjs-volume-control.vjs-volume-vertical {
      background: transparent; width: 40px; height: 60px; margin: 0;
      left: -40px; bottom: 60px; cursor: default;
    }
    .video-js .vjs-volume-bar.vjs-slider-bar { opacity: .75; height: 100%; margin-top: 0; }
    .video-js .vjs-volume-bar.vjs-slider-bar:hover { opacity: 1; }
    .video-js .vjs-volume-bar.vjs-slider-vertical {
      width: 4px; height: 100%; margin: 0 auto; border-radius: 2px;
    }
    .video-js .vjs-volume-level {
      position: absolute; bottom: 0; left: 0; background: #fff;
      border-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.25);
    }
    .video-js .vjs-progress-control .vjs-progress-holder {
      height: 12px; font-size: 1em !important; background: transparent;
      box-shadow: 0 1px 1px rgba(0,0,0,.25);
    }
    .video-js .vjs-progress-control .vjs-progress-holder::before {
      content: ""; position: absolute; left: 0; right: 0; top: 4px;
      height: 4px; border-radius: 2px; background: rgba(255,255,255,.25);
    }
    .video-js .vjs-slider,
    .video-js .vjs-progress-holder .vjs-play-progress,
    .video-js .vjs-progress-holder .vjs-load-progress,
    .video-js .vjs-progress-holder .vjs-load-progress div {
      height: 4px; margin-top: 4px; border-radius: 2px;
      background: rgba(255,255,255,.25);
    }
    .video-js .vjs-progress-holder .vjs-load-progress div { margin-top: 0; }
    .video-js .vjs-progress-holder .vjs-play-progress { background: #fff; }
    .video-js .vjs-play-progress::before {
      content: ""; position: absolute; width: 12px; height: 12px;
      right: -6px; top: -4px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 1px rgba(0,0,0,.25);
    }
    .video-js .vjs-time-tooltip, .video-js .vjs-mouse-display { display: none !important; }
    .video-js .vjs-time-control {
      min-width: auto; position: relative; padding: 0 5px;
      color: rgba(255,255,255,.75); font-size: 12px; line-height: 40px;
      text-shadow: 0 1px 1px rgba(0,0,0,.25); user-select: none;
    }
    .video-js .vjs-current-time { display: block; padding-left: 10px; }
    .video-js .vjs-time-divider, .video-js .vjs-duration { display: block; }
    .video-js .vjs-remaining-time { display: none; }
    .video-js .vjs-pip-button, .video-js .vjs-cast-button {
      width: 36px; height: 30px; margin: 5px 2px; padding: 0;
      color: #fff; opacity: .78; cursor: pointer;
      transition: opacity .1s linear, color .1s linear;
    }
    .video-js .vjs-pip-button:hover, .video-js .vjs-cast-button:hover,
    .video-js .vjs-pip-active, .video-js .vjs-cast-connected { opacity: 1; }
    .video-js .vjs-pip-button .vjs-icon-placeholder,
    .video-js .vjs-cast-button .vjs-icon-placeholder {
      display: grid; place-items: center; width: 100%; height: 100%;
    }
    .video-js .vjs-pip-button svg, .video-js .vjs-cast-button svg {
      display: block; width: 20px; height: 20px; margin: auto; fill: currentColor;
    }
    .video-js .vjs-pip-active, .video-js .vjs-cast-connected { color: #55c1ff; }
    .video-js .vjs-big-play-button {
      display: block !important; position: absolute; width: 100px; height: 100px;
      left: 50%; top: 50%; margin: -50px 0 0 -50px;
      background: transparent !important; border: 0; outline: 0 !important;
      opacity: 0; pointer-events: none; transition: opacity .25s linear, transform .1s ease-out !important;
    }
    .video-js .vjs-big-play-button .vjs-icon-placeholder { display: none; }
    .video-js.vjs-paused .vjs-big-play-button,
    .video-js.vjs-ended .vjs-big-play-button { opacity: 1; pointer-events: auto; }
    .video-js .vjs-big-play-button::before {
      content: ""; position: absolute; inset: 4%; border-radius: 50%;
      background: #000; opacity: .25; transition: opacity .1s linear;
    }
    .video-js .vjs-big-play-button:hover::before { opacity: .5; }
    .video-js .vjs-big-play-button::after {
      content: "▶"; position: absolute; inset: -10%; display: grid;
      place-items: center; color: #fff; font-size: 42px; opacity: .85;
      transition: opacity .1s linear;
    }
    .video-js .vjs-big-play-button:hover::after { opacity: 1; }
    @media (max-aspect-ratio: 16/9) {
      .player { width: 100vw; height: auto; }
    }
    @media (max-width: 520px) {
      .video-js .vjs-pip-button, .video-js .vjs-cast-button {
        width: 30px; margin-left: 0; margin-right: 0;
      }
      .video-js .vjs-time-control { padding-left: 3px; padding-right: 3px; }
    }
    .player.error .vjs-error-display { display: block; }
  </style>
</head>
<body>
  <main class="player" id="player">
    <video id="video" class="video-js" controls preload="metadata" playsinline
      aria-label="Foltyn+ video player">
      Your browser does not support HTML video.
    </video>
  </main>

  <script>
    window.__onGCastApiAvailable = function (available) {
      window.foltynCastApiAvailable = available;
      window.dispatchEvent(new CustomEvent('foltyn-cast-api-available', { detail: available }));
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script src="https://vjs.zencdn.net/7.0.3/video.js"></script>
  <script>
    (() => {
      const playerElement = document.getElementById('player');
      const videoElement = document.getElementById('video');
      const Button = videojs.getComponent('Button');

      class PictureInPictureButton extends Button {
        constructor(player, options) {
          super(player, options);
          this.controlText('Picture in Picture');
          this.addClass('vjs-pip-button');
          const icon = this.el().querySelector('.vjs-icon-placeholder');
          if (icon) icon.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7Zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Zm0 16H3V5h18v14Z"/></svg>';
          this.updateAvailability();
          videoElement.addEventListener('enterpictureinpicture', () => this.updateState(true));
          videoElement.addEventListener('leavepictureinpicture', () => this.updateState(false));
        }
        updateAvailability() {
          if (document.pictureInPictureEnabled && typeof videoElement.requestPictureInPicture === 'function') this.show();
          else this.hide();
        }
        updateState(active) {
          this.el().classList.toggle('vjs-pip-active', active);
          this.controlText(active ? 'Exit Picture in Picture' : 'Picture in Picture');
        }
        async handleClick() {
          try {
            if (document.pictureInPictureElement === videoElement) await document.exitPictureInPicture();
            else if (document.pictureInPictureEnabled && videoElement.requestPictureInPicture) await videoElement.requestPictureInPicture();
          } catch (error) { console.warn('Picture-in-Picture could not start:', error); }
        }
      }

      class CastButton extends Button {
        constructor(player, options) {
          super(player, options);
          this.controlText('Cast to device');
          this.addClass('vjs-cast-button');
          this.hide();
          const icon = this.el().querySelector('.vjs-icon-placeholder');
          if (icon) icon.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 18v3h3a3 3 0 0 0-3-3Zm0-5v3a5 5 0 0 1 5 5h3a8 8 0 0 0-8-8Zm0-5v3c5.52 0 10 4.48 10 10h3C15 14.16 9.84 9 2 9Zm18-6H4a2 2 0 0 0-2 2v2h2V7h16v10h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg>';
        }
        async handleClick() {
          if (!window.cast || !window.cast.framework) return;
          const context = cast.framework.CastContext.getInstance();
          try {
            let session = context.getCurrentSession();
            if (!session) session = await context.requestSession();
            if (!session) return;
            const mediaInfo = new chrome.cast.media.MediaInfo(videoElement.currentSrc || videoElement.src, 'application/x-mpegURL');
            mediaInfo.streamType = chrome.cast.media.StreamType.BUFFERED;
            mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
            mediaInfo.metadata.title = 'Foltyn+';
            await session.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo));
          } catch (error) {
            if (error && error.code !== 'cancel') console.warn('Cast could not start:', error);
          }
        }
      }

      videojs.registerComponent('PictureInPictureButton', PictureInPictureButton);
      videojs.registerComponent('FoltynCastButton', CastButton);

      const player = videojs(videoElement, {
        controls: true,
        autoplay: false,
        preload: 'metadata',
        fluid: false,
        controlBar: {
          children: [
            'playToggle', 'progressControl', 'currentTimeDisplay', 'timeDivider',
            'durationDisplay', 'volumePanel', 'PictureInPictureButton',
            'FoltynCastButton', 'fullscreenToggle'
          ],
          volumeMenuButton: { inline: false, vertical: true },
          volumePanel: { inline: false },
          progressControl: { seekBar: true },
          textTrackSettings: false,
          remainingTimeDisplay: false,
          subtitlesButton: false,
          captionsButton: false,
          audioTrackButton: false
        }
      });

      player.on('ready', () => {
        playerElement.classList.add('ready');
        player.getChild('controlBar').getChild('PictureInPictureButton').updateAvailability();
      });

      function onCastApiAvailable(available) {
        const castButton = player.getChild('controlBar').getChild('FoltynCastButton');
        if (!available || !window.cast || !window.cast.framework || !window.chrome || !window.chrome.cast) {
          castButton.hide();
          return;
        }
        const context = cast.framework.CastContext.getInstance();
        context.setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: cast.AutoJoinPolicy.ORIGIN_SCOPED
        });
        castButton.show();
        context.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, event => {
          const connected = event.sessionState === cast.framework.SessionState.SESSION_STARTED ||
            event.sessionState === cast.framework.SessionState.SESSION_RESUMED;
          castButton.el().classList.toggle('vjs-cast-connected', connected);
        });
      }

      window.addEventListener('foltyn-cast-api-available', event => onCastApiAvailable(event.detail));
      if (typeof window.foltynCastApiAvailable === 'boolean') onCastApiAvailable(window.foltynCastApiAvailable);

      // No bundled demo media: the player waits for a real movie ID in ?id=.
      const tmdbId = new URLSearchParams(window.location.search).get('id');
      if (!tmdbId) {
        player.error({ code: 4, message: 'Missing TMDB ID' });
        return;
      }

      fetch(`/api/movie?id=${encodeURIComponent(tmdbId)}`)
        .then(response => {
          if (!response.ok) throw new Error(`Source request failed (${response.status})`);
          return response.json();
        })
        .then(payload => {
          const source = payload.servers?.find(server => server.status === 'ready' && server.url)?.url;
          if (!source) throw new Error('No playable source was returned');
          player.src({ src: source, type: 'application/x-mpegURL' });
          player.play().catch(() => {});
        })
        .catch(error => {
          console.error('[Foltyn+] Player source error:', error);
          player.error({ code: 4, message: error.message });
        });
    })();
  </script>
</body>
</html>
