<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Foltyn+ Player</title>
  <style>
    :root {
      --bg: #000;
      --panel: rgba(0, 0, 0, 0.7);
      --panel-edge: rgba(255,255,255,0.12);
      --track: rgba(255,255,255,0.25);
      --track-fill: rgba(255,255,255,0.9);
      --accent: #fff;
      --text: #fff;
      --muted: rgba(255,255,255,0.8);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .player {
      position: relative;
      width: min(100vw, 960px);
      height: min(100vh, 540px);
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
      outline: none;
      user-select: none;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.25) 32%, transparent 58%);
      pointer-events: none;
      z-index: 2;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: block;
    }

    .big-play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 108px;
      height: 108px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      cursor: pointer;
      z-index: 3;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s;
      opacity: 1;
    }

    .big-play:hover { background: rgba(0,0,0,0.34); }
    .big-play:active { transform: translate(-50%, -50%) scale(0.96); }
    .big-play.hidden { opacity: 0; pointer-events: none; }

    .icon {
      width: 26px;
      height: 26px;
      display: inline-block;
      vertical-align: middle;
      color: var(--text);
      fill: currentColor;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 10px 10px;
      z-index: 4;
      opacity: 1;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .player.hide-controls .controls {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .progress {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .progress .track {
      position: relative;
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress .buffer,
    .progress .played {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      height: 100%;
      border-radius: inherit;
    }

    .progress .buffer {
      background: rgba(255,255,255,0.32);
    }

    .progress .played {
      background: var(--track-fill);
    }

    .progress .thumb {
      position: absolute;
      left: 0%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }

    button.control {
      background: transparent;
      border: 0;
      color: rgba(255,255,255,0.9);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      opacity: 0.9;
    }

    button.control:hover { background: rgba(255,255,255,0.08); }
    button.control:active { transform: scale(0.96); }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume {
      width: 0;
      opacity: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
      accent-color: #fff;
    }

    .volume-wrap:hover .volume,
    .volume-wrap:focus-within .volume {
      width: 78px;
      opacity: 1;
    }

    .time {
      min-width: 84px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .spacer { flex: 1; }

    .status {
      position: absolute;
      left: 16px;
      bottom: 58px;
      z-index: 4;
      max-width: min(80%, 440px);
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.38);
      border-radius: 999px;
      font-size: 12px;
      color: rgba(255,255,255,0.82);
      backdrop-filter: blur(5px);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .status.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 620px) {
      .player { width: 100vw; height: 100vh; }
      .time { min-width: 72px; }
      .volume-wrap:hover .volume,
      .volume-wrap:focus-within .volume { width: 62px; }
    }
  </style>
</head>
<body>
  <div class="player" id="player" tabindex="0">
    <video id="video" playsinline preload="metadata"></video>

    <button id="bigPlay" class="big-play" aria-label="Play video">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg>
    </button>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div class="controls">
      <div id="progress" class="progress" aria-label="Seek" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="track">
          <div id="buffer" class="buffer"></div>
          <div id="played" class="played"></div>
          <div id="thumb" class="thumb"></div>
        </div>
      </div>

      <div class="row">
        <button id="toggle" class="control" aria-label="Play">
          <svg id="toggleIcon" class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor"></path>
          </svg>
        </button>

        <div class="volume-wrap">
          <button id="mute" class="control" aria-label="Mute">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10v4h4l5 5V5L7 10H3zm12.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12zm0-8.5a8.5 8.5 0 0 1 0 17v-2a6.5 6.5 0 0 0 0-13v-2z" fill="currentColor"></path>
            </svg>
          </button>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        </div>

        <div id="time" class="time">0:00 / 0:00</div>
        <div class="spacer"></div>

        <button id="fullscreen" class="control" aria-label="Fullscreen">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3H3v4h2V5h2V3zm12 0h-4v2h2v2h2V3zM3 17v4h4v-2H5v-2H3zm16 0v2h-2v2h4v-4h-2z" fill="currentColor"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20"></script>
  <script>
    (() => {
      const player = document.getElementById('player');
      const video = document.getElementById('video');
      const bigPlay = document.getElementById('bigPlay');
      const toggle = document.getElementById('toggle');
      const toggleIcon = document.getElementById('toggleIcon');
      const mute = document.getElementById('mute');
      const volume = document.getElementById('volume');
      const timeEl = document.getElementById('time');
      const progressEl = document.getElementById('progress');
      const bufferEl = document.getElementById('buffer');
      const playedEl = document.getElementById('played');
      const thumbEl = document.getElementById('thumb');
      const statusEl = document.getElementById('status');
      const fullscreenBtn = document.getElementById('fullscreen');

      const FALLBACK_SRC = 'https://archive.org/download/BigBuckBunny_328/BigBuckBunny_512kb.mp4';
      let hls = null;
      let hideTimer = null;

      const setStatus = (message) => {
        statusEl.textContent = message || '';
        statusEl.classList.toggle('show', !!message);
      };

      const formatTime = (seconds) => {
        const safe = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
        const h = Math.floor(safe / 3600);
        const m = Math.floor((safe % 3600) / 60);
        const s = safe % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        return `${m}:${String(s).padStart(2, '0')}`;
      };

      const updateToggleIcon = () => {
        const isPlaying = !video.paused && !video.ended;
        toggle.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
        toggleIcon.innerHTML = isPlaying
          ? '<path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor"></path>'
          : '<path d="M8 5v14l11-7z" fill="currentColor"></path>';
        bigPlay.classList.toggle('hidden', isPlaying);
      };

      const updateProgress = () => {
        const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
        const current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        const pct = duration > 0 ? (current / duration) * 100 : 0;
        const buffered = video.buffered && video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
        const bufferPct = duration > 0 ? (buffered / duration) * 100 : 0;

        playedEl.style.width = `${pct}%`;
        thumbEl.style.left = `${pct}%`;
        bufferEl.style.width = `${bufferPct}%`;
        progressEl.setAttribute('aria-valuenow', String(Math.round(pct)));
        timeEl.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      };

      const pokeControls = () => {
        player.classList.remove('hide-controls');
        clearTimeout(hideTimer);
        if (!video.paused) {
          hideTimer = setTimeout(() => player.classList.add('hide-controls'), 2500);
        }
      };

      const togglePlayback = async () => {
        try {
          if (video.paused) {
            await video.play();
          } else {
            video.pause();
          }
        } catch (err) {
          console.warn('Playback toggle failed:', err);
        }
      };

      const attachHls = (src) => {
        if (window.Hls && Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls({
            maxBufferLength: 30,
            backBufferLength: 90,
            maxBufferSize: 60 * 1000 * 1000
          });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              console.error('HLS fatal error:', data);
              setStatus('Playback error. Try another source.');
            }
          });
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
          });
        } else {
          video.src = src;
        }
      };

      const loadSource = async () => {
        const params = new URLSearchParams(window.location.search);
        const tmdbId = params.get('id');

        if (!tmdbId) {
          video.src = FALLBACK_SRC;
          setStatus('No movie ID supplied; using fallback test stream.');
          return;
        }

        setStatus('Loading movie source…');

        try {
          const response = await fetch(`/api/movie?id=${encodeURIComponent(tmdbId)}`);
          const payload = await response.json();

          if (!response.ok || !payload.success) {
            throw new Error(payload?.error || `Request failed (${response.status})`);
          }

          const source = (payload.servers || []).find((server) => server.status === 'ready' && server.url)?.url;
          if (!source) throw new Error('No playable source was returned.');

          attachHls(source);
          setStatus('');
        } catch (error) {
          console.error('Movie fetch failed:', error);
          video.src = FALLBACK_SRC;
          setStatus('Source unavailable — using fallback test stream.');
        }
      };

      video.addEventListener('play', () => updateToggleIcon());
      video.addEventListener('pause', () => updateToggleIcon());
      video.addEventListener('ended', () => updateToggleIcon());
      video.addEventListener('timeupdate', updateProgress);
      video.addEventListener('loadedmetadata', updateProgress);
      video.addEventListener('progress', updateProgress);
      video.addEventListener('volumechange', () => {
        volume.value = String(video.volume);
      });
      video.addEventListener('error', () => {
        setStatus('Playback error — trying fallback stream.');
        if (video.currentSrc !== FALLBACK_SRC) {
          video.src = FALLBACK_SRC;
        }
      });

      toggle.addEventListener('click', togglePlayback);
      bigPlay.addEventListener('click', togglePlayback);
      mute.addEventListener('click', () => {
        video.muted = !video.muted;
      });
      volume.addEventListener('input', (event) => {
        const next = Number(event.target.value);
        video.volume = next;
        video.muted = next === 0;
      });

      fullscreenBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await player.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (err) {
          console.warn('Fullscreen toggle failed:', err);
        }
      });

      progressEl.addEventListener('pointerdown', (event) => {
        const rect = progressEl.getBoundingClientRect();
        const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const time = ratio * (video.duration || 0);
        if (Number.isFinite(time)) video.currentTime = time;
        updateProgress();
      });

      progressEl.addEventListener('keydown', (event) => {
        const step = event.shiftKey ? 15 : 5;
        if (event.key === 'ArrowRight') { video.currentTime = Math.min(video.duration || 0, video.currentTime + step); }
        if (event.key === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - step); }
      });

      player.addEventListener('pointermove', pokeControls);
      player.addEventListener('pointerdown', pokeControls);
      player.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === ' ' || key === 'k') {
          event.preventDefault();
          togglePlayback();
        }
        if (key === 'f') fullscreenBtn.click();
        if (key === 'm') mute.click();
      });

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      volume.value = String(video.volume || 1);
      updateToggleIcon();
      updateProgress();
      loadSource();
      pokeControls();
    })();
  </script>
</body>
</html>
