<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Foltyn+ Player</title>
  <link rel="stylesheet" href="https://vjs.zencdn.net/7.0.3/video-js.css">
  <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0px auto;
  padding: 0px;
  background-color: #333333;
}

body {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.player {
  position: relative;
  width: 640px;
  height: 360px;
  background: #000;
  box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.5);
  line-height: 0px;
  opacity: 0;
  transform: scale3d(0.85, 0.85, 1);
  transition: opacity 0.25s linear, transform 0.25s ease-out;
}
.player.ready {
  opacity: 1;
  transform: scale3d(1, 1, 1);
}
.player::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  box-shadow: inset 0px 0px 0px 1px rgba(255, 255, 255, 0.05), inset 0px 1px 0px rgba(255, 255, 255, 0.05);
  pointer-events: none;
}

.video-js {
  width: 100%;
  height: 100%;
  font-size: 12px;
  font-family: Helvetica, Arial, sans-serif;
  text-shadow: none !important;
  outline: none !important;
}

.video-js .vjs-control-bar {
  height: 40px;
  background-color: transparent;
}

.vjs-control-bar::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0px;
  height: 120px;
  background-image: linear-gradient(to top, black 0%, rgba(0, 0, 0, 0.738) 19%, rgba(0, 0, 0, 0.541) 34%, rgba(0, 0, 0, 0.382) 47%, rgba(0, 0, 0, 0.278) 56.5%, rgba(0, 0, 0, 0.194) 65%, rgba(0, 0, 0, 0.126) 75%, rgba(0, 0, 0, 0.063) 88%, rgba(0, 0, 0, 0));
  opacity: 0.75;
  pointer-events: none;
}

.video-js .vjs-volume-panel .vjs-volume-control.vjs-volume-vertical {
  background-color: transparent;
  width: 40px;
  height: 60px;
  margin: 0px;
  left: -40px;
  bottom: 60px;
  cursor: default;
  transition: visibility 0.5s, opacity 0.5s, height 0.5s 0.5s, width 0.5s 0.5s, left 0.5s 0.5s, top 0.5s 0.5s;
}

.video-js .vjs-volume-bar.vjs-slider-bar {
  opacity: 0.75;
  height: 100%;
  margin-top: 0px;
  transition: opacity 0.1s linear;
}

.video-js .vjs-volume-bar.vjs-slider-bar:hover {
  opacity: 1;
}

.video-js .vjs-play-control,
.video-js .vjs-mute-control,
.video-js .vjs-fullscreen-control,
.video-js .vjs-progress-control .vjs-progress-holder {
  opacity: 0.75;
  transition: transform 0.1s ease-out, opacity 0.1s linear;
}

.video-js .vjs-play-control,
.video-js .vjs-mute-control,
.video-js .vjs-fullscreen-control {
  width: 30px;
  height: 30px;
  margin: 5px;
  padding: 0px !important;
}

.video-js .vjs-icon-placeholder::before {
  content: "" !important;
}

.video-js .vjs-play-control:hover,
.video-js .vjs-mute-control:hover,
.video-js .vjs-fullscreen-control:hover,
.video-js .vjs-progress-control .vjs-progress-holder:hover {
  opacity: 1;
}

.video-js .vjs-play-control:active,
.video-js .vjs-mute-control:active,
.video-js .vjs-fullscreen-control:active {
  transform: scale3d(0.95, 0.95, 1);
}

.video-js .vjs-control:focus {
  text-shadow: none !important;
  outline: none !important;
}

.video-js .vjs-play-control.vjs-paused .vjs-icon-placeholder {
  background-position: -10px -150px;
}

.video-js .vjs-play-control.vjs-playing .vjs-icon-placeholder {
  background-position: -10px -180px;
}

.video-js .vjs-play-control.vjs-ended .vjs-icon-placeholder {
  background-position: -10px -120px;
}

.video-js .vjs-mute-control .vjs-icon-placeholder {
  background-position: -40px -120px;
}

.video-js .vjs-mute-control.vjs-vol-0 .vjs-icon-placeholder {
  background-position: -40px -120px;
}

.video-js .vjs-mute-control.vjs-vol-1 .vjs-icon-placeholder {
  background-position: -40px -150px;
}

.video-js .vjs-mute-control.vjs-vol-2 .vjs-icon-placeholder {
  background-position: -40px -180px;
}

.video-js .vjs-mute-control.vjs-vol-3 .vjs-icon-placeholder {
  background-position: -40px -210px;
}

.video-js .vjs-fullscreen-control .vjs-icon-placeholder {
  background-position: -70px -150px;
}

.video-js.vjs-fullscreen .vjs-fullscreen-control .vjs-icon-placeholder {
  background-position: -70px -180px;
}

.video-js .vjs-volume-panel {
  width: 40px !important;
  height: 40px !important;
  margin: 0px !important;
}

.vjs-volume-bar.vjs-slider-vertical {
  width: 4px;
  height: 100%;
  margin: 0px auto;
  border-radius: 2px;
}

.video-js .vjs-volume-level {
  position: absolute;
  bottom: 0;
  left: 0;
  background-color: #fff;
  border-radius: 2px;
  box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
}

.vjs-slider-vertical .vjs-volume-level::before {
  position: absolute;
  top: -6px;
  left: -4px;
  z-index: 1;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: #FFF;
  content: "";
  box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
}

.video-js .vjs-big-play-button {
  display: block !important;
  position: absolute;
  width: 100px;
  height: 100px;
  left: 50%;
  top: 50%;
  margin-left: -50px;
  margin-top: -50px;
  background-color: transparent !important;
  border: none;
  outline: none !important;
  transition: opacity 0.25s linear, transform 0.1s ease-out !important;
  opacity: 0;
  pointer-events: none;
}

.vjs-big-play-button .vjs-icon-placeholder {
  display: none;
}

.video-js.vjs-paused .vjs-big-play-button,
.video-js.vjs-ended .vjs-big-play-button {
  opacity: 1;
  pointer-events: auto;
}

.vjs-big-play-button::before,
.vjs-big-play-button::after {
  content: "";
  position: absolute;
  transform: translate3d(0, 0, 0);
}

.vjs-big-play-button::before {
  left: 4%;
  right: 4%;
  top: 4%;
  bottom: 4%;
  border-radius: 50%;
  background-color: #000000;
  opacity: 0.25;
  transition: opacity 0.1s linear;
}

.vjs-big-play-button:hover::before {
  opacity: 0.5;
}

.vjs-big-play-button::after {
  left: -10%;
  right: -10%;
  top: -10%;
  bottom: -10%;
  background-position: center top;
  opacity: 0.75;
  transition: opacity 0.1s linear;
}

.video-js.vjs-ended .vjs-big-play-button::after {
  background-position: center bottom;
}

.vjs-big-play-button:hover::after {
  opacity: 1;
}

.vjs-big-play-button:active {
  transform: scale3d(0.95, 0.95, 1);
}

.video-js .vjs-progress-control .vjs-progress-holder {
  font-size: 1em !important;
  height: 12px;
  background-color: transparent;
  box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
}

.video-js .vjs-progress-control .vjs-progress-holder::before {
  content: "";
  position: absolute;
  left: 0px;
  right: 0px;
  top: 4px;
  height: 4px;
  border-radius: 2px;
  background-color: rgba(255, 255, 255, 0.25);
  box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
}

.video-js .vjs-progress-holder .vjs-load-progress,
.video-js .vjs-progress-holder .vjs-load-progress div {

}

.video-js .vjs-progress-holder .vjs-load-progress div {

.video-js .vjs-progress-holder .vjs-load-progress {

}

.video-js .vjs-progress-holder .vjs-play-progress {
  background-color: white;
}

.video-js .vjs-play-progress::before {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  right: -6px;
  top: -4px;
  border-radius: 50%;
  background-color: #FFFFFF;
  box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
}

.video-js .vjs-time-tooltip,
.video-js .vjs-mouse-display {
  display: none !important;
}

.video-js .vjs-progress-control {
  cursor: default;
}

.video-js .vjs-current-time {
  display: block;
}

.video-js .vjs-time-divider {
  display: block;
}

.video-js .vjs-duration {
  display: block;
}

.video-js .vjs-remaining-time {
  display: none;
}

.video-js .vjs-time-control {
  position: relative;
  min-width: auto;
  font-size: 12px;
  line-height: 40px;
  padding-left: 5px;
  padding-right: 5px;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0px 1px 1px rgba(0, 0, 0, 0.25);
  user-select: none;
}

.video-js .vjs-current-time {
  padding-left: 10px;
}

.video-js .vjs-pip-button,
.video-js .vjs-cast-button {

  margin: 5px 2px;

.video-js .vjs-pip-button:hover,

.video-js .vjs-pip-active,

  <script>
/* Foltyn+ Video.js skin enhancements — brand is code/document metadata only. */
const $player = document.querySelector('.player');
const $video = document.querySelector('.video-js');
const videojs = window.videojs;
const Button = videojs.getComponent('Button');

class PictureInPictureButton extends Button {
  constructor(player, options) {
    super(player, options);
    this.controlText('Picture in Picture');
    this.addClass('vjs-pip-button');
    const icon = this.el().querySelector('.vjs-icon-placeholder');
    if (icon) {
      icon.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M19 7h-8v6h8V7Zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Zm0 16H3V5h18v14Z" fill="currentColor"/></svg>';
    }
    this.updateAvailability();
    $video.addEventListener('enterpictureinpicture', () => this.updateState(true));
    $video.addEventListener('leavepictureinpicture', () => this.updateState(false));
  }

  updateAvailability() {
    const supported = document.pictureInPictureEnabled && typeof $video.requestPictureInPicture === 'function';
    if (supported) this.show();
    else this.hide();
  }

  updateState(active) {
    this.el().classList.toggle('vjs-pip-active', active);
    this.controlText(active ? 'Exit Picture in Picture' : 'Picture in Picture');
  }

  async handleClick() {
    if (document.pictureInPictureElement === $video) {
      await document.exitPictureInPicture();
    } else if (document.pictureInPictureEnabled && typeof $video.requestPictureInPicture === 'function') {
      try {
        await $video.requestPictureInPicture();
      } catch (error) {
        console.warn('Foltyn+ Picture-in-Picture could not start:', error);
      }
    }
  }
}

class CastButton extends Button {

    this.addClass('vjs-cast-button');
    this.hide();
    const icon = this.el().querySelector('.vjs-icon-placeholder');
    if (icon) {
      icon.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2 18v3h3a3 3 0 0 0-3-3Zm0-5v3a5 5 0 0 1 5 5h3a8 8 0 0 0-8-8Zm0-5v3c5.52 0 10 4.48 10 10h3C15 14.16 9.84 9 2 9Zm18-6H4a2 2 0 0 0-2 2v2h2V7h16v10h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z" fill="currentColor"/></svg>';
    }
  }

  async handleClick() {
    if (!window.cast || !window.cast.framework) return;
    const context = window.cast.framework.CastContext.getInstance();
    try {
      let session = context.getCurrentSession();
      if (!session) session = await context.requestSession();
      if (!session) return;
      const source = $video.querySelector('source');
      const contentType = (source && source.type) || 'video/mp4';
      const mediaInfo = new window.chrome.cast.media.MediaInfo($video.currentSrc || $video.src, contentType);
      mediaInfo.streamType = window.chrome.cast.media.StreamType.BUFFERED;
      mediaInfo.metadata = new window.chrome.cast.media.GenericMediaMetadata();
      mediaInfo.metadata.title = $video.getAttribute('aria-label') || 'Video';
      await session.loadMedia(new window.chrome.cast.media.LoadRequest(mediaInfo));
    } catch (error) {
      if (error && error.code !== 'cancel') console.warn('Foltyn+ Cast could not start:', error);
    }
  }
}

videojs.registerComponent('PictureInPictureButton', PictureInPictureButton);
videojs.registerComponent('FoltynCastButton', CastButton);

const vjs = videojs($video, {
  controlBar: {
    children: ['playToggle', 'progressControl', 'currentTimeDisplay', 'timeDivider', 'durationDisplay',
      'volumePanel', 'PictureInPictureButton', 'FoltynCastButton', 'fullscreenToggle'],
    volumeMenuButton: { inline: false, vertical: true },
    volumePanel: { inline: false },
    progressControl: { seekBar: true },
    textTrackSettings: false,
    currentTimeDisplay: true,
    timeDivider: true,
    durationDisplay: true,
    remainingTimeDisplay: false,
    subtitlesButton: false,
    captionsButton: false,
    audioTrackButton: false
  }
});

vjs.on('ready', () => {
  $player.classList.add('ready');
  const pipButton = vjs.getChild('controlBar').getChild('PictureInPictureButton');
  pipButton.updateAvailability();
  const progress = vjs.el().querySelector('.vjs-play-progress.vjs-slider-bar');
  vjs.on('seeking', () => {
    if (progress && Number.isFinite(vjs.duration()) && vjs.duration() > 0) {
      progress.style.width = `${(vjs.currentTime() / vjs.duration()) * 100}%`;
    }
  });
});

function onCastApiAvailable(available) {
  const castButton = vjs.getChild('controlBar').getChild('FoltynCastButton');
  if (!available || !window.cast || !window.chrome || !window.chrome.cast) {
    castButton.hide();
    return;
  }
  const context = window.cast.framework.CastContext.getInstance();
  context.setOptions({
    receiverApplicationId: window.chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy: window.cast.AutoJoinPolicy.ORIGIN_SCOPED
  });
  castButton.show();
  context.addEventListener(window.cast.framework.CastContextEventType.SESSION_STATE_CHANGED, (event) => {
    const connected = event.sessionState === window.cast.framework.SessionState.SESSION_STARTED ||
      event.sessionState === window.cast.framework.SessionState.SESSION_RESUMED;
    castButton.el().classList.toggle('vjs-cast-connected', connected);
  });
}

window.addEventListener('foltyn-cast-api-available', (event) => onCastApiAvailable(event.detail));
if (typeof window.foltynCastApiAvailable === 'boolean') onCastApiAvailable(window.foltynCastApiAvailable);

const tmdbId = new URLSearchParams(window.location.search).get('id');
if (tmdbId) {
  fetch(`/api/movie?id=${encodeURIComponent(tmdbId)}`)
    .then((response) => {
      if (!response.ok) throw new Error(`Source request failed (${response.status})`);
      return response.json();
    })
    .then((payload) => {
      const source = payload.servers?.find((server) => server.status === 'ready' && server.url)?.url;
      if (!source) throw new Error('No playable source was returned');
      vjs.src({ src: source, type: 'application/x-mpegURL' });
      vjs.play().catch(() => {});
    })
    .catch((error) => {
      console.error('[v0] Player source error:', error);
      vjs.error({ code: 4, message: error.message });
    });
} else {
  vjs.error({ code: 4, message: 'Missing TMDB ID' });
}

  </script>
